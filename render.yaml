services:
  - type: web
    name: conservas-del-mundo
    env: python
    region: frankfurt
    plan: free
    buildCommand: pip install uv && uv sync && uv run python -m ingest.ingest
    startCommand: uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
