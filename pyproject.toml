[project]
name = "conservas-world"
version = "0.1.0"
description = "Base de datos mundial de conservas, fermentos y encurtidos"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "pydantic>=2.9",
    "httpx>=0.27",
    "pandas>=2.2",
    "lxml>=5.3",
    "pycountry>=24.6",
    "openpyxl>=3.1.5",
    "mcp>=1.2",
    "pyjwt[crypto]>=2.8",
    "email-validator>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
    "mypy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
preview = false
src = ["app", "ingest", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"app/**" = ["B008"]
"ingest/**" = ["B008", "UP007", "UP006"]
"tests/**" = ["B008"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
